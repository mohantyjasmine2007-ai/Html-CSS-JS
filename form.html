<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration Form</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-info">

    <div class="container py-5">

        <h1 class="text-center text-white mb-4">
            Student Registration Form
        </h1>

        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <form class="bg-white p-4 rounded shadow border">

                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" name="fullname" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="email" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Mobile</label>
                        <input type="tel" class="form-control" name="mobile" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" name="confirm_password" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label d-block">Gender</label>

                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" value="Male" required>
                            <label class="form-check-label">Male</label>
                        </div>

                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" value="Female">
                            <label class="form-check-label">Female</label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Branch</label>

                        <select class="form-select" name="branch" required>
                            <option value="">Select Branch</option>
                            <option>Computer Science (CSE)</option>
                            <option>Information Technology (IT)</option>
                            <option>Electronics & Communication (ECE)</option>
                            <option>Electrical & Electronics (EEE)</option>
                            <option>Mechanical Engineering (ME)</option>
                            <option>Civil Engineering (CE)</option>
                        </select>
                    </div>

                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="terms" required>
                        <label class="form-check-label" for="terms">
                            I accept the Terms and Conditions
                        </label>
                    </div>

                    <button type="submit" class="btn btn-success">Register</button>
                    <button type="reset" class="btn btn-danger">Reset</button>

                </form>

            </div>
        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <a href="moodle.html" class="btn btn-secondary">← Back to Moodle</a>
</body>
</html>
